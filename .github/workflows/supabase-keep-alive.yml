
name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Mantener activa la base de datos Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Iniciando comprobación de Supabase..."

          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Código de respuesta: $HTTP_CODE"
          echo "Respuesta: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error al conectar con Supabase."
            exit 1
          fi

          echo "Conexión con Supabase exitosa."
